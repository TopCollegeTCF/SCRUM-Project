  </text>

  <g transform="translate(980,150)" opacity="0.9">
    <ellipse cx="0" cy="0" rx="70" ry="24" fill="none" stroke="#bef264" stroke-width="3"/>
    <ellipse cx="0" cy="-36" rx="70" ry="24" fill="none" stroke="#a3e635" stroke-width="3"/>
    <ellipse cx="0" cy="36" rx="70" ry="24" fill="none" stroke="#84cc16" stroke-width="3"/>
    <line x1="-70" y1="0" x2="-70" y2="-36" stroke="#bef264" stroke-width="3"/>
    <line x1="70" y1="0" x2="70" y2="-36" stroke="#a3e635" stroke-width="3"/>
    <line x1="-70" y1="0" x2="-70" y2="36" stroke="#84cc16" stroke-width="3"/>
    <line x1="70" y1="0" x2="70" y2="36" stroke="#84cc16" stroke-width="3"/>
