<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#f5d0fe"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg2)"/>
  <rect width="1200" height="300" fill="url(#grid2)"/>

  <circle cx="1050" cy="60" r="120" fill="#f0abfc" opacity="0.12"/>
  <circle cx="150" cy="260" r="140" fill="#c026d3" opacity="0.10"/>
  <circle cx="600" cy="150" r="220" fill="#7c3aed" opacity="0.08"/>

  <text x="60" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">
    Agile в реальном мире
  </text>
  <text x="60" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#f5d0fe">
    Спринт 1 — Урок 2 · Найм и требования
  </text>

  <rect x="60" y="195" width="240" height="44" rx="22" fill="url(#accent2)"/>
  <text x="180" y="223" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e1b4b">
    Поиск вакансии · скриншот
  </text>

  <text x="60" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#a78bfa">
    Найдите объявление с Agile / Scrum / Kanban · пришлите скрин
  </text>

  <g transform="translate(980,150)" opacity="0.9">
    <ellipse cx="0" cy="0" rx="70" ry="24" fill="none" stroke="#f0abfc" stroke-width="3"/>
    <ellipse cx="0" cy="-36" rx="70" ry="24" fill="none" stroke="#e879f9" stroke-width="3"/>
    <ellipse cx="0" cy="36" rx="70" ry="24" fill="none" stroke="#d946ef" stroke-width="3"/>
    <line x1="-70" y1="0" x2="-70" y2="-36" stroke="#f0abfc" stroke-width="3"/>
    <line x1="70" y1="0" x2="70" y2="-36" stroke="#e879f9" stroke-width="3"/>
    <line x1="-70" y1="0" x2="-70" y2="36" stroke="#d946ef" stroke-width="3"/>
    <line x1="70" y1="0" x2="70" y2="36" stroke="#d946ef" stroke-width="3"/>
  </g>
</svg>
