<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg1)"/>
  <rect width="1200" height="300" fill="url(#grid1)"/>

  <circle cx="1050" cy="60" r="120" fill="#67e8f9" opacity="0.14"/>
  <circle cx="150" cy="260" r="140" fill="#22d3ee" opacity="0.10"/>
  <circle cx="600" cy="150" r="220" fill="#0891b2" opacity="0.08"/>

  <text x="60" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">
    Agile · Scrum · Kanban
  </text>
  <text x="60" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#cffafe">
    Спринт 1 — Урок 1 · Манифест и принципы
  </text>

  <rect x="60" y="195" width="280" height="44" rx="22" fill="url(#accent1)"/>
  <text x="200" y="223" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">
    agilemanifesto.org · scrumguides.org
  </text>

  <text x="60" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8">
    Выбрать 1 принцип Agile · прочитать Scrum Guide
  </text>

  <g transform="translate(980,150)" opacity="0.9">
    <ellipse cx="0" cy="0" rx="70" ry="24" fill="none" stroke="#67e8f9" stroke-width="3"/>
    <ellipse cx="0" cy="-36" rx="70" ry="24" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <ellipse cx="0" cy="36" rx="70" ry="24" fill="none" stroke="#a5f3fc" stroke-width="3"/>
    <line x1="-70" y1="0" x2="-70" y2="-36" stroke="#67e8f9" stroke-width="3"/>
    <line x1="70" y1="0" x2="70" y2="-36" stroke="#22d3ee" stroke-width="3"/>
    <line x1="-70" y1="0" x2="-70" y2="36" stroke="#a5f3fc" stroke-width="3"/>
    <line x1="70" y1="0" x2="70" y2="36" stroke="#a5f3fc" stroke-width="3"/>
  </g>
</svg>
